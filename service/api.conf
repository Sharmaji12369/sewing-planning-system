# Windows service SewingPlanningAPI - the backend on port 4000 (PORT in backend\.env).
# Read by SewingHost.exe. Relative paths are from this folder.
name=SewingPlanningAPI
exe=C:\Program Files\nodejs\node.exe
args=--import tsx src/server.ts
workdir=..\backend
log=logs\api.log
env.NODE_ENV=production
