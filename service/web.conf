# Windows service SewingPlanningWeb - the web app on port 3100, which the Cloudflare
# tunnel serves. It runs the last `npm run build`, not the source files.
# Read by SewingHost.exe. Relative paths are from this folder.
name=SewingPlanningWeb
exe=C:\Program Files\nodejs\node.exe
args=node_modules\next\dist\bin\next start -p 3100
workdir=..\frontend
log=logs\web.log
env.NODE_ENV=production
env.NEXT_TELEMETRY_DISABLED=1
env.NEXT_DIST_DIR=.next
